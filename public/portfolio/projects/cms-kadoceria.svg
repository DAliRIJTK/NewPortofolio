    <!-- Book Spread Illustration -->
    <rect x="66" y="124" width="336" height="206" rx="10" fill="#162A23" stroke="#10B981" stroke-opacity="0.5"/>
    <line x1="234" y1="124" x2="234" y2="330" stroke="#1E3A31" stroke-width="2"/>

    <!-- Hotspot 1 -->
    <circle cx="145" cy="195" r="22" fill="#10B981" fill-opacity="0.25" stroke="#34D399" stroke-width="2" stroke-dasharray="4 3"/>
