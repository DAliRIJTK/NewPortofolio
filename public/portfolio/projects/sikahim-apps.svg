  <text x="128" y="48" fill="#8B949E" font-family="monospace" font-size="11">https://sikahim.masjid-agenda.id/calendar-events</text>

  <!-- Project Badge -->
  <rect x="576" y="33" width="176" height="22" rx="11" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
  <text x="664" y="48" text-anchor="middle" fill="#34D399" font-family="sans-serif" font-weight="700" font-size="10.5">MOSQUE AGENDA SYSTEM</text>

  
    <!-- Left Panel: Interactive Mosque Event Calendar -->
