    <text x="76" y="226" fill="#34D399" font-family="monospace" font-size="10">Core Recovery: 94%</text>

    <rect x="64" y="246" width="190" height="52" rx="6" fill="#064E3B" stroke="#34D399"/>
    <text x="76" y="268" fill="#ECFDF5" font-family="sans-serif" font-weight="700" font-size="11">80m – 145m · High-Grade Ore</text>
    <text x="76" y="286" fill="#A7F3D0" font-family="monospace" font-size="10">Assay Logged · Oracle DB</text>

    <rect x="64" y="308" width="190" height="42" rx="6" fill="#162822" stroke="#1E3A31"/>
    <text x="76" y="328" fill="#9CA3AF" font-family="sans-serif" font-size="11">145m – 200m · Bedrock</text>
    <text x="76" y="342" fill="#6EE7B7" font-family="monospace" font-size="10">Drilling In Progress</text>

    <!-- Right Area: Survey Metrics & Table -->
    <rect x="290" y="80" width="146" height="82" rx="10" fill="url(#cardGrad)" stroke="#1E3A31"/>
