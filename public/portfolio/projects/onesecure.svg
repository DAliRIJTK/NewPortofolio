<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1310"/>
      <stop offset="50%" stop-color="#0F221C"/>
      <stop offset="100%" stop-color="#131920"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#162822"/>
      <stop offset="100%" stop-color="#111A1D"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#34D399" stroke-width="0.6" stroke-opacity="0.07"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <circle cx="700" cy="70" r="180" fill="#10B981" fill-opacity="0.08"/>
  <circle cx="100" cy="390" r="160" fill="#34D399" fill-opacity="0.06"/>

  <!-- Outer Browser / App Frame -->
  <rect x="28" y="24" width="744" height="402" rx="16" fill="#0D1513" stroke="#1E3A31" stroke-width="1.5"/>
  <!-- Top Window Bar -->
  <path d="M28 40C28 31.1634 35.1634 24 44 24H756C764.837 24 772 31.1634 772 40V64H28V40Z" fill="#12211C"/>
  <line x1="28" y1="64" x2="772" y2="64" stroke="#1E3A31" stroke-width="1.5"/>
  <circle cx="50" cy="44" r="5.5" fill="#EF4444" fill-opacity="0.8"/>
  <circle cx="68" cy="44" r="5.5" fill="#F59E0B" fill-opacity="0.8"/>
  <circle cx="86" cy="44" r="5.5" fill="#10B981" fill-opacity="0.8"/>

  <!-- URL / Header Pill -->
  <rect x="114" y="33" width="440" height="22" rx="6" fill="#0A1210" stroke="#1E3A31" stroke-width="1"/>
  <text x="128" y="48" fill="#8B949E" font-family="monospace" font-size="11">C:\OneSecure\OneSecure.exe --encrypt-aes --embed-pvd</text>

  <!-- Project Badge -->
  <rect x="576" y="33" width="176" height="22" rx="11" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
  <text x="664" y="48" text-anchor="middle" fill="#34D399" font-family="sans-serif" font-weight="700" font-size="10.5">AES-128 &amp; PVD STEGO</text>

  
    <!-- Stage 1: Plaintext Input -->
    <rect x="44" y="80" width="216" height="330" rx="12" fill="#111D19" stroke="#1E3A31"/>
    <text x="64" y="108" fill="#34D399" font-family="sans-serif" font-weight="700" font-size="12">1. PLAINTEXT &amp; KEY</text>
    <rect x="64" y="126" width="176" height="76" rx="8" fill="#0B1310" stroke="#1E3A31"/>
    <text x="78" y="148" fill="#9CA3AF" font-family="monospace" font-size="10">Secret Message:</text>
    <text x="78" y="170" fill="#ECFDF5" font-family="monospace" font-weight="700" font-size="11">&quot;CONFIDENTIAL_JTK&quot;</text>
    <text x="78" y="190" fill="#34D399" font-family="monospace" font-size="10">128-bit Key Expanded</text>

    <rect x="64" y="218" width="176" height="168" rx="8" fill="#162822"/>
    <text x="78" y="242" fill="#ECFDF5" font-family="sans-serif" font-weight="600" font-size="11">AES Core Transformations</text>
    <text x="78" y="266" fill="#A7F3D0" font-family="monospace" font-size="10.5">• subBytes() / S-Box</text>
    <text x="78" y="288" fill="#A7F3D0" font-family="monospace" font-size="10.5">• shiftRows()</text>
    <text x="78" y="310" fill="#A7F3D0" font-family="monospace" font-size="10.5">• mixColumns()</text>
    <text x="78" y="332" fill="#A7F3D0" font-family="monospace" font-size="10.5">• addRoundKey()</text>
    <text x="78" y="362" fill="#34D399" font-family="monospace" font-size="10">10 Rounds · Encrypt/Decrypt</text>

    <!-- Stage 2: AES Cipher State Matrix -->
    <rect x="280" y="80" width="224" height="330" rx="12" fill="url(#cardGrad)" stroke="#10B981" stroke-opacity="0.5"/>
    <text x="302" y="108" fill="#34D399" font-family="sans-serif" font-weight="700" font-size="12">2. AES 4x4 STATE MATRIX</text>

    <!-- 4x4 Hex Grid -->
    <g fill="#0B1310" stroke="#34D399" stroke-opacity="0.6">
      <rect x="304" y="132" width="40" height="36" rx="4"/><rect x="348" y="132" width="40" height="36" rx="4"/><rect x="392" y="132" width="40" height="36" rx="4"/><rect x="436" y="132" width="40" height="36" rx="4"/>
      <rect x="304" y="174" width="40" height="36" rx="4"/><rect x="348" y="174" width="40" height="36" rx="4"/><rect x="392" y="174" width="40" height="36" rx="4"/><rect x="436" y="174" width="40" height="36" rx="4"/>
      <rect x="304" y="216" width="40" height="36" rx="4"/><rect x="348" y="216" width="40" height="36" rx="4"/><rect x="392" y="216" width="40" height="36" rx="4"/><rect x="436" y="216" width="40" height="36" rx="4"/>
      <rect x="304" y="258" width="40" height="36" rx="4"/><rect x="348" y="258" width="40" height="36" rx="4"/><rect x="392" y="258" width="40" height="36" rx="4"/><rect x="436" y="258" width="40" height="36" rx="4"/>
    </g>
    <g fill="#34D399" font-family="monospace" font-size="11" text-anchor="middle">
      <text x="324" y="155">3A</text><text x="368" y="155">7F</text><text x="412" y="155">C4</text><text x="456" y="155">19</text>
      <text x="324" y="197">B2</text><text x="368" y="197">08</text><text x="412" y="197">E1</text><text x="456" y="197">5D</text>
      <text x="324" y="239">9C</text><text x="368" y="239">44</text><text x="412" y="239">A0</text><text x="456" y="239">6B</text>
      <text x="324" y="281">F5</text><text x="368" y="281">2E</text><text x="412" y="281">83</text><text x="456" y="281">D7</text>
    </g>

    <rect x="304" y="316" width="172" height="68" rx="8" fill="#111D19"/>
    <text x="390" y="344" text-anchor="middle" fill="#ECFDF5" font-family="sans-serif" font-weight="600" font-size="11">Ciphertext Hex Output</text>
    <text x="390" y="366" text-anchor="middle" fill="#A7F3D0" font-family="monospace" font-size="10">3A7FC419B208E15D...</text>

    <!-- Stage 3: PVD Steganography PNG Carrier -->
    <rect x="524" y="80" width="232" height="330" rx="12" fill="#111D19" stroke="#1E3A31"/>
    <text x="546" y="108" fill="#34D399" font-family="sans-serif" font-weight="700" font-size="12">3. PVD STEGANOGRAPHY</text>

    <rect x="546" y="126" width="188" height="168" rx="8" fill="#162822" stroke="#10B981"/>
    <text x="640" y="154" text-anchor="middle" fill="#ECFDF5" font-family="monospace" font-weight="700" font-size="12">stego_image.png</text>
    <text x="640" y="178" text-anchor="middle" fill="#9CA3AF" font-family="sans-serif" font-size="11">Pixel Value Differencing</text>
    <!-- Pixel pair blocks -->
    <rect x="568" y="196" width="60" height="36" rx="4" fill="#064E3B" stroke="#34D399"/>
    <text x="598" y="218" text-anchor="middle" fill="#ECFDF5" font-family="monospace" font-size="11">P(i)=142</text>
    <rect x="652" y="196" width="60" height="36" rx="4" fill="#064E3B" stroke="#34D399"/>
    <text x="682" y="218" text-anchor="middle" fill="#ECFDF5" font-family="monospace" font-size="11">P(i+1)=157</text>
    <text x="640" y="256" text-anchor="middle" fill="#34D399" font-family="monospace" font-size="10.5">Δd = |157 - 142| → Embed Bits</text>

    <rect x="546" y="312" width="188" height="72" rx="8" fill="#064E3B"/>
    <text x="640" y="340" text-anchor="middle" fill="#ECFDF5" font-family="monospace" font-weight="700" font-size="11">readPNG / savePNG</text>
    <text x="640" y="362" text-anchor="middle" fill="#A7F3D0" font-family="monospace" font-size="10">C / C++ Library Application</text>
    
</svg>
