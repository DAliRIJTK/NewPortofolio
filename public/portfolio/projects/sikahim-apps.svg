      <rect x="178" y="180" width="50" height="44" rx="6"/>
      <rect x="234" y="180" width="50" height="44" rx="6"/>
      <rect x="290" y="180" width="50" height="44" rx="6" fill="#064E3B" stroke="#34D399"/>
      <rect x="346" y="180" width="50" height="44" rx="6"/>
      <rect x="402" y="180" width="42" height="44" rx="6"/>
