    <!-- Calendar Grid -->
    <g fill="#162822" stroke="#1E3A31">
      <rect x="66" y="128" width="50" height="44" rx="6"/>
      <rect x="122" y="128" width="50" height="44" rx="6"/>
      <rect x="178" y="128" width="50" height="44" rx="6" fill="#064E3B" stroke="#34D399"/>
      <rect x="234" y="128" width="50" height="44" rx="6"/>
      <rect x="290" y="128" width="50" height="44" rx="6"/>
