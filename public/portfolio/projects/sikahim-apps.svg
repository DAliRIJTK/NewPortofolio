    <text x="371" y="154" text-anchor="middle" fill="#ECFDF5" font-family="sans-serif" font-weight="700" font-size="12">15</text>
    <text x="147" y="206" text-anchor="middle" fill="#ECFDF5" font-family="sans-serif" font-weight="700" font-size="12">18</text>
    <text x="315" y="206" text-anchor="middle" fill="#ECFDF5" font-family="sans-serif" font-weight="700" font-size="12">21</text>

    <!-- Selected Agenda Details -->
    <rect x="66" y="242" width="378" height="70" rx="8" fill="#162822" stroke="#10B981" stroke-opacity="0.4"/>
    <text x="84" y="266" fill="#ECFDF5" font-family="sans-serif" font-weight="700" font-size="13">Kajian Subuh &amp; Tahsin Jamaah</text>
    <text x="84" y="286" fill="#9CA3AF" font-family="sans-serif" font-size="11">Jadwal Terverifikasi · Kuota: 88 / 100 Jamaah Terdaftar</text>
    <rect x="84" y="296" width="260" height="6" rx="3" fill="#0B1310"/>
    <rect x="84" y="296" width="228" height="6" rx="3" fill="url(#emeraldGrad)"/>

    <rect x="66" y="324" width="378" height="64" rx="8" fill="#162822"/>
