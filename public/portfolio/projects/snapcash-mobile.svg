<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1310"/>
      <stop offset="50%" stop-color="#0F221C"/>
      <stop offset="100%" stop-color="#131920"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#162822"/>
      <stop offset="100%" stop-color="#111A1D"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#34D399" stroke-width="0.6" stroke-opacity="0.07"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <circle cx="700" cy="70" r="180" fill="#10B981" fill-opacity="0.08"/>
  <circle cx="100" cy="390" r="160" fill="#34D399" fill-opacity="0.06"/>

  <!-- Outer Browser / App Frame -->
  <rect x="28" y="24" width="744" height="402" rx="16" fill="#0D1513" stroke="#1E3A31" stroke-width="1.5"/>
  <!-- Top Window Bar -->
  <path d="M28 40C28 31.1634 35.1634 24 44 24H756C764.837 24 772 31.1634 772 40V64H28V40Z" fill="#12211C"/>
  <line x1="28" y1="64" x2="772" y2="64" stroke="#1E3A31" stroke-width="1.5"/>
  <circle cx="50" cy="44" r="5.5" fill="#EF4444" fill-opacity="0.8"/>
  <circle cx="68" cy="44" r="5.5" fill="#F59E0B" fill-opacity="0.8"/>
  <circle cx="86" cy="44" r="5.5" fill="#10B981" fill-opacity="0.8"/>

  <!-- URL / Header Pill -->
  <rect x="114" y="33" width="440" height="22" rx="6" fill="#0A1210" stroke="#1E3A31" stroke-width="1"/>
  <text x="128" y="48" fill="#8B949E" font-family="monospace" font-size="11">snapcash://android-compose-app &amp; api.snapcash.service</text>

  <!-- Project Badge -->
  <rect x="576" y="33" width="176" height="22" rx="11" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
  <text x="664" y="48" text-anchor="middle" fill="#34D399" font-family="sans-serif" font-weight="700" font-size="10.5">ANDROID + EXPRESS API</text>

  
    <!-- Left: Android Phone Frame with Receipt Scanner -->
    <rect x="64" y="76" width="210" height="336" rx="24" fill="#0A1210" stroke="#34D399" stroke-width="2"/>
    <rect x="134" y="86" width="70" height="8" rx="4" fill="#1E3A31"/>
    <text x="169" y="114" text-anchor="middle" fill="#34D399" font-family="sans-serif" font-weight="700" font-size="12">Receipt Camera Scan</text>

    <!-- Receipt inside phone -->
    <rect x="88" y="126" width="162" height="190" rx="8" fill="#152620" stroke="#10B981" stroke-dasharray="5 3"/>
    <!-- Corner viewfinder brackets -->
    <path d="M96 144 V134 H106 M242 144 V134 H232 M96 298 V308 H106 M242 298 V308 H232" stroke="#34D399" stroke-width="2.5"/>
    <text x="169" y="154" text-anchor="middle" fill="#ECFDF5" font-family="monospace" font-weight="700" font-size="11">MINIMARKET RECEIPT</text>
    <line x1="104" y1="164" x2="234" y2="164" stroke="#1E3A31"/>
    <text x="104" y="184" fill="#A7F3D0" font-family="monospace" font-size="10">Coffee Beans   45.000</text>
    <text x="104" y="204" fill="#A7F3D0" font-family="monospace" font-size="10">Fresh Milk     28.500</text>
    <text x="104" y="224" fill="#A7F3D0" font-family="monospace" font-size="10">Whole Bread    21.500</text>
    <rect x="100" y="244" width="138" height="26" rx="4" fill="#064E3B" stroke="#34D399"/>
    <text x="169" y="261" text-anchor="middle" fill="#ECFDF5" font-family="monospace" font-weight="700" font-size="11">TOTAL: Rp 95.000</text>

    <rect x="96" y="332" width="146" height="32" rx="16" fill="#10B981"/>
    <text x="169" y="352" text-anchor="middle" fill="#07130F" font-family="sans-serif" font-weight="700" font-size="11">Auto-Extract Items</text>

    <!-- Right: Spending Analytics & Express/Firebase Backend -->
    <rect x="304" y="80" width="452" height="330" rx="12" fill="#111D19" stroke="#1E3A31"/>
    <text x="328" y="110" fill="#F0F6FC" font-family="sans-serif" font-weight="700" font-size="15">Monthly Expense Analytics &amp; Cloud Sync</text>

    <rect x="328" y="128" width="194" height="84" rx="10" fill="url(#cardGrad)" stroke="#1E3A31"/>
    <text x="344" y="152" fill="#9CA3AF" font-family="sans-serif" font-size="11">Monthly Budget Used</text>
    <text x="344" y="186" fill="#34D399" font-family="sans-serif" font-weight="700" font-size="24">Rp 2.45M</text>

    <rect x="538" y="128" width="194" height="84" rx="10" fill="url(#cardGrad)" stroke="#1E3A31"/>
    <text x="554" y="152" fill="#9CA3AF" font-family="sans-serif" font-size="11">13 Jetpack Compose Screens</text>
    <text x="554" y="186" fill="#ECFDF5" font-family="sans-serif" font-weight="700" font-size="20">PDF &amp; Multi-FX</text>

    <!-- Spending Category Progress Bars -->
    <rect x="328" y="226" width="404" height="162" rx="10" fill="#162822"/>
    <text x="348" y="252" fill="#ECFDF5" font-family="sans-serif" font-weight="600" font-size="12">Food &amp; Groceries (54%)</text>
    <rect x="348" y="262" width="360" height="10" rx="5" fill="#0B1310"/>
    <rect x="348" y="262" width="210" height="10" rx="5" fill="url(#emeraldGrad)"/>

    <text x="348" y="296" fill="#ECFDF5" font-family="sans-serif" font-weight="600" font-size="12">Transport &amp; Daily Utilities (28%)</text>
    <rect x="348" y="306" width="360" height="10" rx="5" fill="#0B1310"/>
    <rect x="348" y="306" width="120" height="10" rx="5" fill="#10B981"/>

    <text x="348" y="362" fill="#34D399" font-family="monospace" font-size="11">Kotlin · Jetpack Compose · Node.js · Express · Firebase</text>
    
</svg>
