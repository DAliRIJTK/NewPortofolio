<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1310"/>
      <stop offset="50%" stop-color="#0F221C"/>
      <stop offset="100%" stop-color="#131920"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#162822"/>
      <stop offset="100%" stop-color="#111A1D"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#34D399" stroke-width="0.6" stroke-opacity="0.07"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <circle cx="700" cy="70" r="180" fill="#10B981" fill-opacity="0.08"/>
  <circle cx="100" cy="390" r="160" fill="#34D399" fill-opacity="0.06"/>

  <!-- Outer Browser / App Frame -->
  <rect x="28" y="24" width="744" height="402" rx="16" fill="#0D1513" stroke="#1E3A31" stroke-width="1.5"/>
  <!-- Top Window Bar -->
  <path d="M28 40C28 31.1634 35.1634 24 44 24H756C764.837 24 772 31.1634 772 40V64H28V40Z" fill="#12211C"/>
  <line x1="28" y1="64" x2="772" y2="64" stroke="#1E3A31" stroke-width="1.5"/>
  <circle cx="50" cy="44" r="5.5" fill="#EF4444" fill-opacity="0.8"/>
  <circle cx="68" cy="44" r="5.5" fill="#F59E0B" fill-opacity="0.8"/>
  <circle cx="86" cy="44" r="5.5" fill="#10B981" fill-opacity="0.8"/>

  <!-- URL / Header Pill -->
  <rect x="114" y="33" width="440" height="22" rx="6" fill="#0A1210" stroke="#1E3A31" stroke-width="1"/>
  <text x="128" y="48" fill="#8B949E" font-family="monospace" font-size="11">http://localhost:8501/yolo-meal-detector</text>

  <!-- Project Badge -->
  <rect x="576" y="33" width="176" height="22" rx="11" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
  <text x="664" y="48" text-anchor="middle" fill="#34D399" font-family="sans-serif" font-weight="700" font-size="10.5">YOLOv8 + THEMEALDB API</text>

  
    <!-- Left: YOLOv8 Food Object Detection Frame -->
    <rect x="44" y="80" width="356" height="330" rx="12" fill="#111D19" stroke="#1E3A31"/>
    <text x="66" y="108" fill="#34D399" font-family="sans-serif" font-weight="700" font-size="13">YOLOv8n OBJECT DETECTION CANVAS</text>

    <!-- Simulated Food Image Frame -->
    <rect x="66" y="124" width="312" height="230" rx="10" fill="#15241F" stroke="#1E3A31"/>
    <!-- Plate illustration -->
    <circle cx="185" cy="242" r="76" fill="#1B322A" stroke="#2A4D41" stroke-width="2"/>
    <circle cx="185" cy="242" r="54" fill="#213F35"/>
    <circle cx="170" cy="228" r="10" fill="#EF4444" fill-opacity="0.8"/>
    <circle cx="202" cy="248" r="10" fill="#EF4444" fill-opacity="0.8"/>
    <circle cx="180" cy="260" r="8" fill="#10B981"/>

    <!-- YOLOv8 Bounding Box 1 -->
    <rect x="102" y="156" width="168" height="168" rx="4" fill="none" stroke="#34D399" stroke-width="2.5"/>
    <rect x="102" y="136" width="132" height="20" rx="3" fill="#34D399"/>
    <text x="110" y="150" fill="#07130F" font-family="monospace" font-weight="700" font-size="11">pizza · conf 0.96</text>

    <!-- YOLOv8 Bounding Box 2 -->
    <rect x="282" y="190" width="80" height="96" rx="4" fill="none" stroke="#10B981" stroke-width="2" stroke-dasharray="4 2"/>
    <rect x="282" y="170" width="80" height="20" rx="3" fill="#064E3B"/>
    <text x="288" y="184" fill="#34D399" font-family="monospace" font-weight="700" font-size="10">salad 0.91</text>

    <text x="66" y="382" fill="#9CA3AF" font-family="monospace" font-size="11">Model: yolov8n.pt (640x640)</text>

    <!-- Right: Automated Recipe Retrieval via TheMealDB -->
    <rect x="416" y="80" width="340" height="330" rx="12" fill="url(#cardGrad)" stroke="#1E3A31"/>
    <text x="438" y="108" fill="#F0F6FC" font-family="sans-serif" font-weight="700" font-size="14">TheMealDB Auto-Recipe Response</text>

    <rect x="438" y="126" width="296" height="72" rx="8" fill="#111D19" stroke="#10B981" stroke-opacity="0.4"/>
    <text x="454" y="150" fill="#34D399" font-family="sans-serif" font-weight="700" font-size="13">Matched Dish: Margherita Pizza</text>
    <text x="454" y="172" fill="#9CA3AF" font-family="monospace" font-size="11">GET /api/json/v1/1/search.php?s=pizza</text>

    <rect x="438" y="210" width="296" height="134" rx="8" fill="#111D19" stroke="#1E3A31"/>
    <text x="454" y="234" fill="#ECFDF5" font-family="sans-serif" font-weight="700" font-size="12">Ingredients &amp; Instructions:</text>
    <text x="454" y="256" fill="#A7F3D0" font-family="sans-serif" font-size="11">• Pizza Dough, San Marzano Tomatoes</text>
    <text x="454" y="276" fill="#A7F3D0" font-family="sans-serif" font-size="11">• Fresh Mozzarella, Basil Leaves, Olive Oil</text>
    <text x="454" y="302" fill="#9CA3AF" font-family="sans-serif" font-size="11">1. Stretch dough and spread crushed tomato sauce.</text>
    <text x="454" y="322" fill="#9CA3AF" font-family="sans-serif" font-size="11">2. Bake at 250°C until golden and top with basil.</text>

    <text x="586" y="382" text-anchor="middle" fill="#34D399" font-family="monospace" font-size="11">Python · YOLOv8 · Streamlit · REST API</text>
    
</svg>
