    <rect x="462" y="206" width="272" height="68" rx="8" fill="#111D19" stroke="#1E3A31"/>
    <text x="478" y="228" fill="#A7F3D0" font-family="sans-serif" font-weight="600" font-size="11">Narasi Basa Sunda (MP3/WAV)</text>
    <path d="M480 252 V242 M490 256 V236 M500 254 V240 M510 258 V234 M520 255 V238 M530 260 V232 M540 254 V240 M550 258 V235 M560 252 V242 M570 256 V238 M580 254 V240" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>

    <rect x="462" y="286" width="272" height="58" rx="8" fill="#111D19" stroke="#1E3A31"/>
    <text x="478" y="308" fill="#ECFDF5" font-family="sans-serif" font-weight="600" font-size="11">Background Music &amp; Public REST API</text>
    <text x="478" y="328" fill="#34D399" font-family="monospace" font-size="10">GET /api/books/{slug}/pages</text>

    <text x="598" y="384" text-anchor="middle" fill="#9CA3AF" font-family="monospace" font-size="10.5">Laravel 13 · PHP 8.3 · PostgreSQL</text>
    
