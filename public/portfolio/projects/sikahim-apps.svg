    <text x="84" y="368" fill="#34D399" font-family="monospace" font-size="11">Status: Conflict-Free · Materi Kajian Tersedia</text>

    <!-- Right Panel: Admin & Jamaah Portal Summary -->
    <rect x="480" y="80" width="276" height="330" rx="12" fill="url(#cardGrad)" stroke="#1E3A31"/>
    <text x="502" y="108" fill="#F0F6FC" font-family="sans-serif" font-weight="700" font-size="14">Portal Admin &amp; Jamaah</text>

    <rect x="502" y="126" width="232" height="72" rx="8" fill="#111D19" stroke="#1E3A31"/>
    <text x="518" y="148" fill="#9CA3AF" font-family="sans-serif" font-size="11">Pendaftaran Jamaah Aktif</text>
    <text x="518" y="180" fill="#34D399" font-family="sans-serif" font-weight="700" font-size="24">1,240 Peserta</text>

    <rect x="502" y="210" width="232" height="72" rx="8" fill="#111D19" stroke="#1E3A31"/>
    <text x="518" y="232" fill="#9CA3AF" font-family="sans-serif" font-size="11">Evaluasi &amp; Notifikasi</text>
    <text x="518" y="264" fill="#ECFDF5" font-family="sans-serif" font-weight="700" font-size="18">4.9 / 5.0 Rating</text>

    <rect x="502" y="294" width="232" height="58" rx="8" fill="#064E3B"/>
    <text x="618" y="320" text-anchor="middle" fill="#ECFDF5" font-family="sans-serif" font-weight="700" font-size="12">Laravel 11 · PostgreSQL</text>
    <text x="618" y="338" text-anchor="middle" fill="#A7F3D0" font-family="monospace" font-size="10.5">Tailwind CSS · AdminLTE · Docker</text>
    
</svg>
