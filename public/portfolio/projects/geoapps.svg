    <text x="64" y="126" fill="#9CA3AF" font-family="monospace" font-size="10">Borehole ID: BH-2026-04</text>

    <!-- Depth Layers -->
    <rect x="64" y="144" width="190" height="38" rx="6" fill="#1F362E" stroke="#34D399" stroke-opacity="0.4"/>
    <text x="76" y="162" fill="#ECFDF5" font-family="sans-serif" font-weight="600" font-size="11">0m – 25m · Topsoil / Clay</text>
    <text x="76" y="176" fill="#34D399" font-family="monospace" font-size="10">Sample Verified</text>

    <rect x="64" y="192" width="190" height="44" rx="6" fill="#162A23" stroke="#10B981" stroke-opacity="0.5"/>
