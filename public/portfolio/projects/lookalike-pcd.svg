<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1310"/>
      <stop offset="50%" stop-color="#0F221C"/>
      <stop offset="100%" stop-color="#131920"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#162822"/>
      <stop offset="100%" stop-color="#111A1D"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#34D399" stroke-width="0.6" stroke-opacity="0.07"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <circle cx="700" cy="70" r="180" fill="#10B981" fill-opacity="0.08"/>
  <circle cx="100" cy="390" r="160" fill="#34D399" fill-opacity="0.06"/>

  <!-- Outer Browser / App Frame -->
  <rect x="28" y="24" width="744" height="402" rx="16" fill="#0D1513" stroke="#1E3A31" stroke-width="1.5"/>
  <!-- Top Window Bar -->
  <path d="M28 40C28 31.1634 35.1634 24 44 24H756C764.837 24 772 31.1634 772 40V64H28V40Z" fill="#12211C"/>
  <line x1="28" y1="64" x2="772" y2="64" stroke="#1E3A31" stroke-width="1.5"/>
  <circle cx="50" cy="44" r="5.5" fill="#EF4444" fill-opacity="0.8"/>
  <circle cx="68" cy="44" r="5.5" fill="#F59E0B" fill-opacity="0.8"/>
  <circle cx="86" cy="44" r="5.5" fill="#10B981" fill-opacity="0.8"/>

  <!-- URL / Header Pill -->
  <rect x="114" y="33" width="440" height="22" rx="6" fill="#0A1210" stroke="#1E3A31" stroke-width="1"/>
  <text x="128" y="48" fill="#8B949E" font-family="monospace" font-size="11">http://localhost:8501/lookalike-face-recognition</text>

  <!-- Project Badge -->
  <rect x="576" y="33" width="176" height="22" rx="11" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
  <text x="664" y="48" text-anchor="middle" fill="#34D399" font-family="sans-serif" font-weight="700" font-size="10.5">FACE SIMILARITY &amp; AI</text>

  
    <!-- Left: Dual Face Similarity Comparison -->
    <rect x="44" y="80" width="380" height="330" rx="12" fill="#111D19" stroke="#1E3A31"/>
    <text x="66" y="108" fill="#34D399" font-family="sans-serif" font-weight="700" font-size="13">FACE DETECTION &amp; SIMILARITY MATCHING</text>

    <!-- Face 1 Box -->
    <rect x="66" y="128" width="146" height="164" rx="10" fill="#162822" stroke="#34D399" stroke-width="2"/>
    <circle cx="139" cy="190" r="30" fill="#1F3A31" stroke="#34D399" stroke-width="1.5"/>
    <path d="M98 266 C98 236 180 236 180 266" fill="#1F3A31" stroke="#34D399" stroke-width="1.5"/>
    <text x="139" y="146" text-anchor="middle" fill="#34D399" font-family="monospace" font-size="10">MTCNN Face #1</text>

    <!-- Face 2 Box -->
    <rect x="256" y="128" width="146" height="164" rx="10" fill="#162822" stroke="#34D399" stroke-width="2"/>
    <circle cx="329" cy="190" r="30" fill="#1F3A31" stroke="#34D399" stroke-width="1.5"/>
    <path d="M288 266 C288 236 370 236 370 266" fill="#1F3A31" stroke="#34D399" stroke-width="1.5"/>
    <text x="329" y="146" text-anchor="middle" fill="#34D399" font-family="monospace" font-size="10">MTCNN Face #2</text>

    <!-- Similarity Score Pill -->
    <rect x="114" y="314" width="240" height="44" rx="22" fill="#064E3B" stroke="#34D399" stroke-width="1.5"/>
    <text x="234" y="341" text-anchor="middle" fill="#ECFDF5" font-family="sans-serif" font-weight="700" font-size="15">Similarity Score: 92.8%</text>

    <text x="234" y="386" text-anchor="middle" fill="#9CA3AF" font-family="monospace" font-size="11">Upload Image &amp; Live Webcam Stream</text>

    <!-- Right: Ethnicity, Age & Gender Identifier -->
    <rect x="440" y="80" width="316" height="330" rx="12" fill="url(#cardGrad)" stroke="#1E3A31"/>
    <text x="462" y="108" fill="#F0F6FC" font-family="sans-serif" font-weight="700" font-size="14">Ethnicity, Age &amp; Gender Prediction</text>

    <!-- Age & Gender Badges -->
    <rect x="462" y="126" width="130" height="58" rx="8" fill="#111D19" stroke="#1E3A31"/>
    <text x="476" y="146" fill="#9CA3AF" font-family="sans-serif" font-size="10.5">Estimated Age</text>
    <text x="476" y="172" fill="#34D399" font-family="sans-serif" font-weight="700" font-size="19">21 – 23 yrs</text>

    <rect x="604" y="126" width="130" height="58" rx="8" fill="#111D19" stroke="#1E3A31"/>
    <text x="618" y="146" fill="#9CA3AF" font-family="sans-serif" font-size="10.5">Gender Model</text>
    <text x="618" y="172" fill="#ECFDF5" font-family="sans-serif" font-weight="700" font-size="19">Male (97%)</text>

    <!-- Ethnicity Similarity Bars -->
    <rect x="462" y="198" width="272" height="190" rx="10" fill="#111D19" stroke="#1E3A31"/>
    <text x="480" y="224" fill="#ECFDF5" font-family="sans-serif" font-weight="600" font-size="12">Ethnicity Recognition Breakdown</text>

    <text x="480" y="252" fill="#A7F3D0" font-family="sans-serif" font-size="11">Sundanese / Javanese (78%)</text>
    <rect x="480" y="260" width="236" height="8" rx="4" fill="#0B1310"/>
    <rect x="480" y="260" width="184" height="8" rx="4" fill="url(#emeraldGrad)"/>

    <text x="480" y="294" fill="#A7F3D0" font-family="sans-serif" font-size="11">Malay / Southeast Asian (16%)</text>
    <rect x="480" y="302" width="236" height="8" rx="4" fill="#0B1310"/>
    <rect x="480" y="302" width="54" height="8" rx="4" fill="#10B981"/>

    <text x="480" y="336" fill="#A7F3D0" font-family="sans-serif" font-size="11">Other Ethnic Groups (6%)</text>
    <rect x="480" y="344" width="236" height="8" rx="4" fill="#0B1310"/>
    <rect x="480" y="344" width="22" height="8" rx="4" fill="#059669"/>
    
</svg>
