    <text x="306" y="142" fill="#34D399" font-family="sans-serif" font-weight="700" font-size="26">18 Rigs</text>

    <rect x="450" y="80" width="146" height="82" rx="10" fill="url(#cardGrad)" stroke="#1E3A31"/>
    <text x="466" y="106" fill="#9CA3AF" font-family="sans-serif" font-size="11">Survey Samples</text>
    <text x="466" y="142" fill="#F0F6FC" font-family="sans-serif" font-weight="700" font-size="24">1,420</text>

    <rect x="610" y="80" width="146" height="82" rx="10" fill="url(#cardGrad)" stroke="#1E3A31"/>
    <text x="626" y="106" fill="#9CA3AF" font-family="sans-serif" font-size="11">Database Sync</text>
    <text x="626" y="142" fill="#34D399" font-family="sans-serif" font-weight="700" font-size="20">Oracle + MySQL</text>

    <!-- Exploration Field Data Form / Table -->
    <rect x="290" y="176" width="466" height="234" rx="12" fill="#111D19" stroke="#1E3A31"/>
    <text x="312" y="206" fill="#F0F6FC" font-family="sans-serif" font-weight="700" font-size="14">Field Exploration &amp; Equipment Activity Log</text>
    <line x1="312" y1="220" x2="734" y2="220" stroke="#1E3A31"/>

    <text x="312" y="242" fill="#34D399" font-family="monospace" font-size="11">SITE-A01</text>
    <text x="405" y="242" fill="#ECFDF5" font-family="sans-serif" font-size="11">Diamond Core Drilling · Shift 1</text>
    <rect x="640" y="228" width="90" height="20" rx="10" fill="#064E3B"/>
    <text x="685" y="242" text-anchor="middle" fill="#34D399" font-family="sans-serif" font-size="10">VERIFIED</text>

    <text x="312" y="280" fill="#34D399" font-family="monospace" font-size="11">SITE-B04</text>
    <text x="405" y="280" fill="#ECFDF5" font-family="sans-serif" font-size="11">Geological Mapping &amp; Assay Entry</text>
    <rect x="640" y="266" width="90" height="20" rx="10" fill="#064E3B"/>
    <text x="685" y="280" text-anchor="middle" fill="#34D399" font-family="sans-serif" font-size="10">RECORDED</text>

    <text x="312" y="318" fill="#34D399" font-family="monospace" font-size="11">SITE-C09</text>
    <text x="405" y="318" fill="#ECFDF5" font-family="sans-serif" font-size="11">Heavy Equipment Telemetry Sync</text>
    <rect x="640" y="304" width="90" height="20" rx="10" fill="#1F362E"/>
    <text x="685" y="318" text-anchor="middle" fill="#A7F3D0" font-family="sans-serif" font-size="10">ACTIVE</text>

    <!-- Mini Terrain Sparkline -->
    <polyline points="312,382 365,362 420,374 475,350 535,365 595,342 660,356 730,338" fill="none" stroke="#34D399" stroke-width="2.5"/>
    
</svg>
